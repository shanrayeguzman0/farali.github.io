<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #303030 50%, #3d3d3d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .score-board {
            display: flex;
            gap: 30px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-label {
            color: #888;
            font-size: 0.9rem;
        }

        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
            background: #0a0a0a;
            max-width: 90vw;
            max-height: 60vh;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .d-pad-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            color: #00ff88;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 
                0 4px 0 #0f0f1a,
                0 5px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .d-pad-btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 #0f0f1a,
                inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .d-pad-btn.active {
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            color: #1a1a2e;
        }

        /* Positioning for D-pad */
        .d-pad-btn:nth-child(1) { grid-column: 2; grid-row: 1; } /* Up */
        .d-pad-btn:nth-child(2) { grid-column: 1; grid-row: 2; } /* Left */
        .d-pad-btn:nth-child(3) { grid-column: 2; grid-row: 2; } /* Center/Action */
        .d-pad-btn:nth-child(4) { grid-column: 3; grid-row: 2; } /* Right */
        .d-pad-btn:nth-child(5) { grid-column: 2; grid-row: 3; } /* Down */

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
            z-index: 10;
        }

        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }

        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 10;
        }

        .start-screen h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.3));
        }

        .start-btn {
            padding: 20px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
            to { box-shadow: 0 0 40px rgba(0, 255, 136, 0.8); }
        }

        .instructions {
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        /* Desktop optimizations */
        @media (min-width: 768px) {
            canvas {
                width: 600px;
                height: 600px;
            }
            
            .d-pad {
                display: none;
            }
            
            .instructions::after {
                content: "Use Arrow Keys or WASD to control the snake";
                display: block;
                margin-top: 10px;
            }
        }

        /* Mobile optimizations */
        @media (max-width: 767px) {
            canvas {
                width: 350px;
                height: 350px;
            }
            
            .score-board {
                font-size: 1rem;
                gap: 20px;
            }
            
            .start-screen h1 {
                font-size: 2rem;
            }
            
            .instructions::after {
                content: "Use the D-pad below to control the snake";
                display: block;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div class="score-item">
                <span class="score-label">SCORE</span>
                <span id="score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">HIGH SCORE</span>
                <span id="highScore">0</span>
            </div>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas"></canvas>
            
            <div class="start-screen" id="startScreen">
                <h1>🐍 SNAKE</h1>
                <button class="start-btn" onclick="startGame()">START GAME</button>
                <div class="instructions">
                    Eat the red apples to grow<br>
                    Don't hit the walls or yourself!
                </div>
            </div>

            <div class="game-over" id="gameOver">
                <h2>GAME OVER</h2>
                <p style="font-size: 1.2rem; margin-bottom: 20px;">Final Score: <span id="finalScore">0</span></p>
                <button class="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
            </div>
        </div>

        <div class="controls">
            <div class="d-pad" id="dPad">
                <button class="d-pad-btn" data-dir="up">▲</button>
                <button class="d-pad-btn" data-dir="left">◀</button>
                <button class="d-pad-btn" style="background: #1a1a2e; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);">●</button>
                <button class="d-pad-btn" data-dir="right">▶</button>
                <button class="d-pad-btn" data-dir="down">▼</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOver');

        // Game settings
        const gridSize = 20;
        let tileCount;
        
        // Game state
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;
        let speed = 100;

        // Initialize
        highScoreElement.textContent = highScore;
        
        function resizeCanvas() {
            const size = window.innerWidth < 768 ? 350 : 600;
            canvas.width = size;
            canvas.height = size;
            tileCount = canvas.width / gridSize;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function initGame() {
            // Reset snake to center
            const centerX = Math.floor(tileCount / 2);
            const centerY = Math.floor(tileCount / 2);
            snake = [
                {x: centerX, y: centerY},
                {x: centerX, y: centerY + 1},
                {x: centerX, y: centerY + 2}
            ];
            
            dx = 0;
            dy = -1; // Start moving up
            score = 0;
            speed = 100;
            scoreElement.textContent = score;
            
            spawnFood();
        }

        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (subtle)
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food with glow effect
            const foodX = food.x * gridSize;
            const foodY = food.y * gridSize;
            
            // Glow
            const gradient = ctx.createRadialGradient(
                foodX + gridSize/2, foodY + gridSize/2, 0,
                foodX + gridSize/2, foodY + gridSize/2, gridSize
            );
            gradient.addColorStop(0, 'rgba(255, 51, 51, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 51, 51, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(foodX - gridSize/2, foodY - gridSize/2, gridSize * 2, gridSize * 2);
            
            // Apple
            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.arc(foodX + gridSize/2, foodY + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Stem
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(foodX + gridSize/2, foodY + 2);
            ctx.lineTo(foodX + gridSize/2, foodY - 2);
            ctx.stroke();

            // Draw snake
            snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                
                // Body gradient
                const bodyGradient = ctx.createLinearGradient(x, y, x + gridSize, y + gridSize);
                if (index === 0) {
                    // Head - brighter
                    bodyGradient.addColorStop(0, '#00ff88');
                    bodyGradient.addColorStop(1, '#00cc6a');
                } else {
                    // Body - darker based on position
                    const darkness = Math.min(index * 0.05, 0.4);
                    bodyGradient.addColorStop(0, `rgba(0, 255, 136, ${1 - darkness})`);
                    bodyGradient.addColorStop(1, `rgba(0, 204, 106, ${1 - darkness})`);
                }
                
                // Segment shadow/glow
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = index === 0 ? 15 : 5;
                
                ctx.fillStyle = bodyGradient;
                ctx.fillRect(x + 1, y + 1, gridSize - 2, gridSize - 2);
                
                ctx.shadowBlur = 0;
                
                // Eyes on head
                if (index === 0) {
                    ctx.fillStyle = '#1a1a2e';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    // Determine eye position based on direction
                    let leftEyeX = x + eyeOffset, leftEyeY = y + eyeOffset;
                    let rightEyeX = x + gridSize - eyeOffset - eyeSize, rightEyeY = y + eyeOffset;
                    
                    if (dx === 1) { // Moving right
                        leftEyeX = x + gridSize - eyeOffset - eyeSize;
                        leftEyeY = y + eyeOffset;
                        rightEyeX = x + gridSize - eyeOffset - eyeSize;
                        rightEyeY = y + gridSize - eyeOffset - eyeSize;
                    } else if (dx === -1) { // Moving left
                        leftEyeX = x + eyeOffset;
                        leftEyeY = y + eyeOffset;
                        rightEyeX = x + eyeOffset;
                        rightEyeY = y + gridSize - eyeOffset - eyeSize;
                    } else if (dy === 1) { // Moving down
                        leftEyeX = x + eyeOffset;
                        leftEyeY = y + gridSize - eyeOffset - eyeSize;
                        rightEyeX = x + gridSize - eyeOffset - eyeSize;
                        rightEyeY = y + gridSize - eyeOffset - eyeSize;
                    }
                    
                    ctx.fillRect(leftEyeX, leftEyeY, eyeSize, eyeSize);
                    ctx.fillRect(rightEyeX, rightEyeY, eyeSize, eyeSize);
                }
            });
        }

        function updateGame() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                // Increase speed slightly
                if (speed > 50) speed -= 2;
                
                // Clear and restart game loop with new speed
                clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, speed);
                
                spawnFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function gameStep() {
            updateGame();
        }

        function startGame() {
            startScreen.classList.add('hidden');
            initGame();
            gameRunning = true;
            gameLoop = setInterval(gameStep, speed);
            drawGame();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingLeft = dx === -1;
            const goingRight = dx === 1;

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (!goingDown) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (!goingUp) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (!goingRight) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (!goingLeft) { dx = 1; dy = 0; }
                    break;
            }
        });

        // Touch/D-pad controls
        const dPadButtons = document.querySelectorAll('.d-pad-btn[data-dir]');
        
        dPadButtons.forEach(btn => {
            const direction = btn.dataset.dir;
            
            const handlePress = (e) => {
                e.preventDefault();
                if (!gameRunning) return;
                
                const goingUp = dy === -1;
                const goingDown = dy === 1;
                const goingLeft = dx === -1;
                const goingRight = dx === 1;
                
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 150);
                
                switch(direction) {
                    case 'up':
                        if (!goingDown) { dx = 0; dy = -1; }
                        break;
                    case 'down':
                        if (!goingUp) { dx = 0; dy = 1; }
                        break;
                    case 'left':
                        if (!goingRight) { dx = -1; dy = 0; }
                        break;
                    case 'right':
                        if (!goingLeft) { dx = 1; dy = 0; }
                        break;
                }
            };
            
            btn.addEventListener('touchstart', handlePress, {passive: false});
            btn.addEventListener('mousedown', handlePress);
        });

        // Prevent scrolling on mobile
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.d-pad') || e.target === canvas) {
                e.preventDefault();
            }
        }, {passive: false});

        // Swipe controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            const minSwipeDistance = 30;
            
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
                // Horizontal swipe
                if (deltaX > 0 && dx !== -1) { dx = 1; dy = 0; }
                else if (deltaX < 0 && dx !== 1) { dx = -1; dy = 0; }
            } else if (Math.abs(deltaY) > minSwipeDistance) {
                // Vertical swipe
                if (deltaY > 0 && dy !== -1) { dx = 0; dy = 1; }
                else if (deltaY < 0 && dy !== 1) { dx = 0; dy = -1; }
            }
        }, {passive: true});

        // Initial draw
        drawGame();
    </script>
</body>
</html>

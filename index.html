<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1wWi2qJiHFbPqmit-PCG_McQZhP8GONh6">
    <title>Farali</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-center">
            <p class="loader-text">Going in...</p>
            <div class="spinner">
                <div class="spinner-inner"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="content" style="display:none;">
        
        <!-- Abstract Background Layers -->
        <div class="abstract-bg">
            <div class="bg-layer bg-shine"></div>
            <div class="bg-layer bg-shadow"></div>
            <div class="lines"></div>
            <div class="corner-light"></div>
            
            <!-- Floating Orbs for Glass Refraction -->
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>

            <!-- Content -->
            <div class="page-wrapper">
                
                <!-- Top Logo -->
                <div class="logo-badge">
                    <h4>FavRankerLister</h4>
                </div>

                <!-- Center Stage -->
                <div class="center-stage">
                    
                    <p class="welcome-text">Welcome to</p>
                    
                    <!-- Liquid Glass Main Card -->
                    <div class="glass-box">
                        <div class="glass-reflection"></div>
                        <h1>Farali</h1>
                        <span class="beta-tag">BETA v3.7.4</span>
                    </div>

                    <h2 class="tagline">Rank and Post!</h2>

                    <!-- Liquid Glass CTA Button -->
                    <a href="main.html" class="liquid-btn">
                        <span class="btn-text">Let's Start!</span>
                        <span class="btn-shine"></span>
                        <span class="btn-gloss"></span>
                    </a>

                    <!-- Description -->
                    <div class="glass-info">
                        <h6>
                            Share your own content like pictures, videos, artwork, guitar covers, rants, stories, or even personal announcements. 
                            Communicate with someone! You can also play our games! Rank and list your favorite anime.
                        </h6>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                const content = document.getElementById('content');
                
                loader.style.animation = 'fadeOut 0.8s ease forwards';
                
                setTimeout(() => {
                    content.style.display = 'block';
                    content.style.animation = 'fadeIn 1s ease forwards';
                }, 400);
            }, 1200);
        });
    </script>

</body>
</html>

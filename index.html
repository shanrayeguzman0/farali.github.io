<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --accent-purple: #1a1a2e;
            --text-main: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden; /* Keeps blobs contained */
            height: 100vh;
            width: 100vw;
        }

        /* --- Blurry Blob Animation Background --- */
        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
            background: var(--bg-dark);
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%);
            border-radius: 50%;
            animation: move 20s infinite alternate;
            opacity: 0.6;
        }

        .blob:nth-child(2) {
            background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
            width: 500px;
            height: 500px;
            left: 50%;
            animation-duration: 25s;
            animation-delay: -5s;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(20%, 20%) scale(1.2); }
        }

        /* --- Layout Structure --- */
        .container {
            display: grid;
            height: 100vh;
            width: 100%;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10%;
        }

        /* Top Left: Logo */
        .header-section {
            grid-column: 1;
            grid-row: 1;
        }

        .logo-box h1 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -2px;
        }

        .logo-box span {
            font-size: 2.5rem;
            font-weight: 300;
            display: block;
        }

        /* Bottom Left: Liquid Glass Button */
        .cta-section {
            grid-column: 1;
            grid-row: 2;
        }

        .liquid-button {
            position: relative;
            padding: 20px 40px;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            width: fit-content;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .liquid-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* Right Side: Description (Span both rows on desktop) */
        .desc-section {
            grid-column: 2;
            grid-row: 1 / span 2;
            background: rgba(26, 26, 46, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .description-text {
            font-size: 4rem;
            font-weight: 700;
            text-align: left;
            opacity: 0.9;
            max-width: 80%;
        }

        /* --- Responsive Styles (Mobile) --- */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                overflow-y: auto;
            }

            .header-section {
                grid-column: 1;
                grid-row: 1;
                padding-bottom: 20px;
            }

            .cta-section {
                grid-column: 1;
                grid-row: 2;
                padding-top: 0;
            }

            .desc-section {
                grid-column: 1;
                grid-row: 3;
                min-height: 400px;
                align-items: flex-end;
            }

            .logo-box h1 { font-size: 4rem; }
            .description-text { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="blob-container">
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <main class="container">
        <section class="section header-section">
            <div class="logo-box">
                <h1>Logo</h1>
                <span>version</span>
            </div>
        </section>

        <section class="section cta-section">
            <a href="#" class="liquid-button">button liquid glass</a>
        </section>

        <section class="section desc-section">
            <div class="description-text">
                description
            </div>
        </section>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Hero Layout</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --accent-purple: #1a1a2e;
            --text-main: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- Blob Background --- */
        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
        }
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%);
            border-radius: 50%;
            animation: move 20s infinite alternate;
            opacity: 0.5;
            top: 20%;
            left: 25%;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(10%, 10%) scale(1.1); }
        }

        /* --- Layout --- */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 2rem 4rem;
        }

        /* Top Navigation Bar */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .logo-box h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
        }
        .logo-box span {
            font-size: 0.9rem;
            font-weight: 300;
            opacity: 0.6;
            margin-left: 5px;
        }

        /* Center Hero Section */
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .description-text {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #ffffff, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .liquid-button {
            padding: 18px 45px;
            font-size: 1.1rem;
            color: white;
            text-decoration: none;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px; /* Rounded pill style */
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .liquid-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(76, 29, 149, 0.3);
        }

        @media (max-width: 768px) {
            .app-wrapper { padding: 2rem; }
            .description-text { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="blob-container">
        <div class="blob"></div>
    </div>

    <div class="app-wrapper">
        <header class="nav-header">
            <div class="logo-box">
                <h1>Logo<span>version</span></h1>
            </div>
        </header>

        <main class="hero-container">
            <div class="description-text">
                Your high impact description statement goes right here.
            </div>
            <a href="#" class="liquid-button">Get Started Now</a>
        </main>
    </div>

</body>
</html>

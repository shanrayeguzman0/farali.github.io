<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1wWi2qJiHFbPqmit-PCG_McQZhP8GONh6">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Rank List</title>
    <style>
        :root {
            --bg-primary: #050508;
            --bg-secondary: #0f0f14;
            --bg-card: #16161f;
            --bg-hover: #1e1e2a;
            --border: #2a2a3a;
            --border-hover: #3a3a4f;
            --text-primary: #f0f0f5;
            --text-secondary: #8b8b9e;
            --text-muted: #5a5a6e;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --warning: #f59e0b;
            --golden: #ffd700;
            --peak: #ff4757;
            --remarkable: #a55eea;
            --good: #3742fa;
            --bad: #ffa502;
            --worst: #747d8c;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.7);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Background Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(165, 94, 234, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--accent-hover) 100%);
             text-shadow: 5px 0px 10px rgb(255, 0, 0), -5px 0px 10px blue, 5px -2px 10px cyan;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .btn-danger {
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-success {
            border-color: rgba(34, 197, 94, 0.3);
            color: var(--success);
        }

        .btn-success:hover {
            background: rgba(34, 197, 94, 0.1);
        }

        /* Navigation */
        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .nav-tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            white-space: nowrap;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
        }

        .nav-tab.active {
            color: var(--accent-hover);
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Views */
        .view {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tier Sections */
        .tier-section {
            margin-bottom: 24px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .tier-header {
            padding: 16px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .tier-header:hover {
            background: rgba(255,255,255,0.02);
        }

        .tier-header .toggle-icon {
            margin-left: auto;
            transition: transform 0.2s;
            color: var(--text-muted);
        }

        .tier-section.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .tier-section.collapsed .tier-content {
            display: none;
        }

        .tier-golden .tier-header { 
            background: linear-gradient(90deg, rgba(255,215,0,0.1), transparent); 
            color: var(--golden); 
            border-left: 3px solid var(--golden);
        }
        .tier-peak .tier-header { 
            background: linear-gradient(90deg, rgba(255,71,87,0.1), transparent); 
            color: var(--peak); 
            border-left: 3px solid var(--peak);
        }
        .tier-remarkable .tier-header { 
            background: linear-gradient(90deg, rgba(165,94,234,0.1), transparent); 
            color: var(--remarkable); 
            border-left: 3px solid var(--remarkable);
        }
        .tier-good .tier-header { 
            background: linear-gradient(90deg, rgba(55,66,250,0.1), transparent); 
            color: var(--good); 
            border-left: 3px solid var(--good);
        }
        .tier-bad .tier-header { 
            background: linear-gradient(90deg, rgba(255,165,2,0.1), transparent); 
            color: var(--bad); 
            border-left: 3px solid var(--bad);
        }
        .tier-worst .tier-header { 
            background: linear-gradient(90deg, rgba(116,125,140,0.1), transparent); 
            color: var(--worst); 
            border-left: 3px solid var(--worst);
        }

        .tier-content {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }

        .tier-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Anime Cards */
        .anime-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .anime-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .anime-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .anime-card:hover::before {
            opacity: 1;
        }

        .anime-rank {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .anime-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .anime-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .anime-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .anime-score {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-hover), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .anime-period {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-actions .btn {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        /* Watching Cards */
        .watching-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .watching-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.2s;
        }

        .watching-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow);
        }

        .watching-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .watching-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .watching-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 8px 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stat-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar-label {
            width: 100px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: right;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }

        .bar-value {
            width: 40px;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .genre-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .genre-tag {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-hover);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .score-item {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .score-item label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .score-item input[type="number"] {
            width: 100%;
            padding: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
        }

        .score-preview {
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            margin-top: 16px;
        }

        .score-preview-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-hover);
        }

        .modal-footer {
            padding: 16px 24px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Episode Rating Steps */
        .episode-stepper {
            text-align: center;
            margin-bottom: 20px;
        }

        .episode-stepper h3 {
   font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .episode-stepper p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--success);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            box-shadow: var(--shadow-lg);
            animation: toastSlide 0.3s ease;
            max-width: 300px;
            font-size: 0.9rem;
        }

        @keyframes toastSlide {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }
            .tier-content {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .score-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="logo">✨ Anime Rank List</div>
                <div class="header-actions">
                    <button class="btn" onclick="app.exportData()">📤 Export</button>
                    <button class="btn btn-success" onclick="app.showImportModal()">📥 Import</button>
                    <button class="btn btn-danger" onclick="app.confirmDeleteAll()">🗑️ Delete All</button>
                 <button class="btn" onclick="window.history.back()">⬅️ Back</button>
                </div>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" onclick="app.switchView('ranking')">🏆 Ranking List</button>
                <button class="nav-tab" onclick="app.switchView('watching')">📺 Currently Watching</button>
                <button class="nav-tab" onclick="app.switchView('stats')">📊 Statistics</button>
            </nav>
        </header>

        <main>
            <!-- Ranking View -->
            <div id="ranking-view" class="view active">
                <div id="ranking-container"></div>
            </div>

            <!-- Currently Watching View -->
            <div id="watching-view" class="view">
                <div class="watching-grid" id="watching-container"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="app.showAddModal()">+ Add Anime to Watch</button>
                </div>
            </div>

            <!-- Statistics View -->
            <div id="stats-view" class="view">
                <div id="stats-container"></div>
            </div>
        </main>
    </div>

    <!-- Add Anime Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Add Anime to Watch</div>
                <button class="modal-close" onclick="app.closeModal('add-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Anime Name</label>
                    <input type="text" class="form-input" id="add-name" placeholder="Enter anime name">
                </div>
                <div class="form-group">
                    <label class="form-label">Total Episodes</label>
                    <input type="number" class="form-input" id="add-episodes" min="1" value="12">
                </div>
                <div class="form-group">
                    <label class="form-label">Start Date (auto-set to today)</label>
                    <input type="text" class="form-input" id="add-date" readonly>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="app.closeModal('add-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="app.addWatching()">Add to List</button>
            </div>
        </div>
    </div>

    <!-- Rate Episodes Modal -->
    <div class="modal-overlay" id="rate-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Rate Episodes</div>

    <!-- Import Modal -->
    <div class="modal-overlay" id="import-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Import Data</div>
                <button class="modal-close" onclick="app.closeModal('import-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Select JSON file to import</label>
                    <input type="file" class="form-input" id="import-file" accept=".json" style="padding: 8px;">
                </div>
                <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-muted);">
                    <strong>Warning:</strong> Importing will replace all current data. Make sure to export your current data first if you want to keep it.
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="app.closeModal('import-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="app.importData()">Import</button>
            </div>
        </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const App = {
            animeList: [],
            currentlyWatching: [],
            currentRateIndex: null,
            currentRateEpisodes: [],
            currentRateEpisodeIndex: 0,
            currentRateTotalEpisodes: 0,
            editingIndex: null,

            init() {
                this.load();
                this.render();
                this.setupEventListeners();
            },

            // Persistence
            load() {
                const data = localStorage.getItem('animeRank_data');
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        this.animeList = parsed.animeList || [];
                        this.currentlyWatching = parsed.currentlyWatching || [];
                    } catch (e) {
                        console.error('Failed to load data', e);
                    }
                }
            },

            save() {
                localStorage.setItem('animeRank_data', JSON.stringify({
                    animeList: this.animeList,
                    currentlyWatching: this.currentlyWatching,
                    version: 1
                }));
            },

            // Navigation
            switchView(viewName) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.getElementById(viewName + '-view').classList.add('active');
                event.target.classList.add('active');
                this.render();
            },

            // Rendering
            render() {
                this.renderRanking();
                this.renderWatching();
                this.renderStats();
       },

            renderRanking() {
                const container = document.getElementById('ranking-container');
                if (this.animeList.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🏆</div>
                            <h3>No ranked anime yet</h3>
                            <p>Finish watching some anime to see them ranked here</p>
                        </div>
                    `;
                    return;
                }

                // Sort by rating descending
                const sorted = [...this.animeList].sort((a, b) => b.rating - a.rating);

                const tiers = [
                    { key: 'golden', label: '👑 GOLDEN PIECE OF ANIME', range: [90, 100], color: 'var(--golden)' },
                    { key: 'peak', label: '🔥 PEAK ANIME', range: [80, 90], color: 'var(--peak)' },
                    { key: 'remarkable', label: '✨ REMARKABLE ANIME', range: [75, 80], color: 'var(--remarkable)' },
                    { key: 'good', label: '👍 GOOD ANIME', range: [70, 75], color: 'var(--good)' },
                    { key: 'bad', label: '⚠️ BAD ANIME', range: [60, 70], color: 'var(--bad)' },
                    { key: 'worst', label: '💀 WORST ANIME', range: [0, 60], color: 'var(--worst)' }
                ];

                let html = '';
                tiers.forEach(tier => {
                    const items = sorted.filter(a => {
                        if (tier.key === 'golden') return a.rating >= 90 && a.rating <= 100;
                        if (tier.key === 'worst') return a.rating >= 0 && a.rating < 60;
                        return a.rating >= tier.range[0] && a.rating < tier.range[1];
                    });

                    html += `
                        <div class="tier-section tier-${tier.key}" id="tier-${tier.key}">
                            <div class="tier-header" onclick="app.toggleTier('tier-${tier.key}')">
                                <span>${tier.label}</span>
                                <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 8px;">(${items.length})</span>
                                <span class="toggle-icon">▼</span>
                            </div>
                            <div class="tier-content">
                                ${items.length === 0 ? '<div class="tier-empty">None</div>' : ''}
                                ${items.map((anime, idx) => {
                                    const globalRank = sorted.indexOf(anime) + 1;
                                    return `
                                        <div class="anime-card">
                                            <div class="anime-rank">#${globalRank}</div>
                                            <div class="anime-title">${this.escapeHtml(anime.name)}</div>
                                            <div class="anime-score">${anime.rating.toFixed(2)}</div>
                                            <div class="anime-meta">
                                                <span>📆 ${anime.releaseYear}</span>
                                                <span>🎭 ${this.escapeHtml(anime.genre)}</span>
                                                <span>🎬 ${anime.episodesRated} ep</span>
                                            </div>
                                            <div class="anime-period">🕒 ${this.escapeHtml(anime.watchPeriod)}</div>
                                            <div class="card-actions">
                                                <button class="btn" onclick="app.showEditModal(${this.animeList.indexOf(anime)})">✏️ Edit</button>
                                                <button class="btn btn-danger" onclick="app.deleteAnime(${this.animeList.indexOf(anime)})">🗑️ Delete</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            },

            renderWatching() {
                const container = document.getElementById('watching-container');
                if (this.currentlyWatching.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <div class="empty-state-icon">📺</div>
                            <h3>Not watching anything</h3>
                            <p>Add an anime to start tracking your progress</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.currentlyWatching.map((anime, idx) => {
                    const progress = (anime.currentEpisode / anime.totalEpisodes) * 100;
                    return `
                        <div class="watching-card">
                            <div class="watching-title">${this.escapeHtml(anime.name)}</div>
                            <div class="watching-date">Started: ${anime.startDate}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="watching-meta">
                                <span>EP ${anime.currentEpisode}/${anime.totalEpisodes}</span>
                                <span>${progress.toFixed(0)}%</span>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-primary" onclick="app.showRateModal(${idx})">⭐ Rate Episodes</button>
                                <button class="btn btn-danger" onclick="app.deleteWatching(${idx})">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            renderStats() {
                const container = document.getElementById('stats-container');
                const totalCompleted = this.animeList.length;
                const totalWatching = this.currentlyWatching.length;
                const totalEpisodes = this.animeList.reduce((sum, a) => sum + a.episodesRated, 0) +
                                      this.currentlyWatching.reduce((sum, a) => sum + a.currentEpisode, 0);
                const avgRating = totalCompleted > 0 
                    ? (this.animeList.reduce((sum, a) => sum + a.rating, 0) / totalCompleted).toFixed(2)
                    : '0.00';

                // Tier distribution
                const tiers = [
                    { label: 'Golden (90-100)', count: this.animeList.filter(a => a.rating >= 90).length, color: '#ffd700' },
                    { label: 'Peak (80-89)', count: this.animeList.filter(a => a.rating >= 80 && a.rating < 90).length, color: '#ff4757' },
                    { label: 'Remarkable (75-79)', count: this.animeList.filter(a => a.rating >= 75 && a.rating < 80).length, color: '#a55eea' },
                    { label: 'Good (70-74)', count: this.animeList.filter(a => a.rating >= 70 && a.rating < 75).length, color: '#3742fa' },
                    { label: 'Bad (60-69)', count: this.animeList.filter(a => a.rating >= 60 && a.rating < 70).length, color: '#ffa502' },
                    { label: 'Worst (0-59)', count: this.animeList.filter(a => a.rating < 60).length, color: '#747d8c' }
                ];
                const maxTier = Math.max(...tiers.map(t => t.count), 1);

                // Genre distribution
                const genreMap = {};
                this.animeList.forEach(a => {
                    const genres = a.genre.split(',').map(g => g.trim()).filter(g => g);
                    genres.forEach(g => {
                        genreMap[g] = (genreMap[g] || 0) + 1;
                    });
                });
                const sortedGenres = Object.entries(genreMap).sort((a, b) => b[1] - a[1]).slice(0, 10);

                // Top and bottom
                const sorted = [...this.animeList].sort((a, b) => b.rating - a.rating);
                const topAnime = sorted[0];
                const bottomAnime = sorted[sorted.length - 1];

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Ranked</div>
                            <div class="stat-value">${totalCompleted}</div>
                            <div class="stat-sub">completed anime</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Average Score</div>
                            <div class="stat-value">${avgRating}</div>
                            <div class="stat-sub">out of 100</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Episodes</div>
                            <div class="stat-value">${totalEpisodes}</div>
                            <div class="stat-sub">rated episodes</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Watching Now</div>
                            <div class="stat-value">${totalWatching}</div>
                            <div class="stat-sub">in progress</div>
                        </div>
                    </div>

                    <div class="chart-container">
                        <div class="chart-title">📊 Tier Distribution</div>
                        <div class="bar-chart">
                            ${tiers.map(t => `
                                <div class="bar-item">
                                    <div class="bar-label">${t.label}</div>
                                    <div class="bar-track">
                                        <div class="bar-fill" style="width: ${(t.count / maxTier) * 100}%; background: ${t.color};">
                                            ${t.count > 0 ? t.count : ''}
                                        </div>
                                    </div>
                                    <div class="bar-value">${t.count}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${sortedGenres.length > 0 ? `
                        <div class="chart-container">
                            <div class="chart-title">🎭 Top Genres</div>
                            <div class="genre-tags">
                                ${sortedGenres.map(([genre, count]) => `
                                    <span class="genre-tag">${this.escapeHtml(genre)} (${count})</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${topAnime ? `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-label">🏆 Highest Rated</div>
                                <div style="font-size: 1.1rem; font-weight: 700; margin: 8px 0;">${this.escapeHtml(topAnime.name)}</div>
                                <div class="stat-value" style="font-size: 1.5rem;">${topAnime.rating.toFixed(2)}</div>
                            </div>
                            ${bottomAnime && bottomAnime !== topAnime ? `
                                <div class="stat-card">
                                    <div class="stat-label">📉 Lowest Rated</div>
                                    <div style="font-size: 1.1rem; font-weight: 700; margin: 8px 0;">${this.escapeHtml(bottomAnime.name)}</div>
                                    <div class="stat-value" style="font-size: 1.5rem;">${bottomAnime.rating.toFixed(2)}</div>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}
                `;
            },

            toggleTier(id) {
                document.getElementById(id).classList.toggle('collapsed');
            },

            // Modal Management
            showModal(id) {
                document.getElementById(id).classList.add('active');
                document.body.style.overflow = 'hidden';
            },

            closeModal(id) {
                document.getElementById(id).classList.remove('active');
                document.body.style.overflow = '';
            },

            showAddModal() {
                document.getElementById('add-name').value = '';
                document.getElementById('add-episodes').value = '12';
                document.getElementById('add-date').value = this.getFormattedToday();
                this.showModal('add-modal');
            },

            showRateModal(index) {
                this.currentRateIndex = index;
                this.currentRateEpisodes = [];
                this.currentRateEpisodeIndex = 0;
                document.getElementById('rate-episode-count').value = '1';
                document.getElementById('rate-step-select').classList.remove('hidden');
                document.getElementById('rate-step-rate').classList.add('hidden');
                document.getElementById('rate-step-finish').classList.add('hidden');
                document.getElementById('rate-next-btn').classList.add('hidden');
                document.getElementById('rate-finish-btn').classList.add('hidden');
                this.showModal('rate-modal');
            },

            showEditModal(index) {
                this.editingIndex = index;
                const anime = this.animeList[index];
                document.getElementById('edit-title').textContent = anime.name;
                // Reset edit inputs
                document.querySelectorAll('[id^="ed-"]').forEach(el => el.value = '0');
                document.getElementById('ed-preview').textContent = '0.00';
                this.showModal('edit-modal');
            },

            showImportModal() {
                document.getElementById('import-file').value = '';
                this.showModal('import-modal');
            },

            // Anime Operations
            addWatching() {
                const name = document.getElementById('add-name').value.trim();
                const episodes = parseInt(document.getElementById('add-episodes').value);
                const date = document.getElementById('add-date').value;

                if (!name) { this.showToast('Please enter anime name', 'error'); return; }
                if (!episodes || episodes < 1) { this.showToast('Invalid episode count', 'error'); return; }

                this.currentlyWatching.push({
                    name,
                    startDate: date,
                    totalEpisodes: episodes,
                    currentEpisode: 0,
                    totalEpisodeScore: 0
                });

                this.save();
                this.render();
                this.closeModal('add-modal');
                this.showToast('Added to Currently Watching');
            },

            startEpisodeRating() {
                const count = parseInt(document.getElementById('rate-episode-count').value);
                const anime = this.currentlyWatching[this.currentRateIndex];
                const remaining = anime.totalEpisodes - anime.currentEpisode;

                if (!count || count < 1) { this.showToast('Invalid number', 'error'); return; }
                if (count > remaining) { this.showToast(`Only ${remaining} episodes remaining`, 'error'); return; }

                this.currentRateTotalEpisodes = count;
                this.currentRateEpisodeIndex = 0;
                this.currentRateEpisodes = [];

                document.getElementById('rate-step-select').classList.add('hidden');
                document.getElementById('rate-step-rate').classList.remove('hidden');
                document.getElementById('rate-next-btn').classList.remove('hidden');
                this.updateEpisodeStepper();
                this.clearRateInputs();
            },

            updateEpisodeStepper() {
                document.getElementById('current-ep-num').textContent = this.currentRateEpisodeIndex + 1;
                document.getElementById('current-ep-title').textContent = `of ${this.currentRateTotalEpisodes}`;
            },

            clearRateInputs() {
                document.querySelectorAll('[id^="rs-"]').forEach(el => {
                    if (el.type === 'number') el.value = '0';
                });
                document.getElementById('rs-preview').textContent = '0.00';
            },

            calcEpisodeScore() {
                const get = id => parseFloat(document.getElementById(id)?.value) || 0;
                const story = get('rs-story') + get('rs-dialogue') + get('rs-clarity');
                const animation = get('rs-art') + get('rs-motion');
                const music = get('rs-op') + get('rs-ed') + get('rs-concept') + get('rs-sfx') + get('rs-attractive');
                const voice = get('rs-voice');
                const experience = get('rs-intensity') + get('rs-enjoyment') + get('rs-expressive');
                const characters = get('rs-personalities') + get('rs-styles');
                return story + animation + music + voice + experience + characters;
            },

            calcEditScore() {
                const get = id => parseFloat(document.getElementById(id)?.value) || 0;
                const story = get('ed-story') + get('ed-ending') + get('ed-clarity');
                const animation = get('ed-art') + get('ed-motion');
                const music = get('ed-op') + get('ed-ed') + get('ed-concept') + get('ed-sfx') + get('ed-attractive');
                const voice = get('ed-voice');
                const experience = get('ed-intensity') + get('ed-enjoyment') + get('ed-expressive');
                const characters = get('ed-personalities') + get('ed-styles');
                return story + animation + music + voice + experience + characters;
            },

            submitEpisodeRating() {
                const score = this.calcEpisodeScore();
                this.currentRateEpisodes.push(score);
               this.currentRateEpisodeIndex++;

                const anime = this.currentlyWatching[this.currentRateIndex];

                if (this.currentRateEpisodeIndex >= this.currentRateTotalEpisodes) {
                    // Done rating all episodes
                    const newTotalScore = anime.totalEpisodeScore + this.currentRateEpisodes.reduce((a, b) => a + b, 0);
                    const newCurrentEpisode = anime.currentEpisode + this.currentRateEpisodes.length;

                    anime.totalEpisodeScore = newTotalScore;
                    anime.currentEpisode = newCurrentEpisode;

                    if (anime.currentEpisode >= anime.totalEpisodes) {
                        // Anime finished
                        document.getElementById('rate-step-rate').classList.add('hidden');
                        document.getElementById('rate-step-finish').classList.remove('hidden');
                        document.getElementById('rate-next-btn').classList.add('hidden');
                        document.getElementById('rate-finish-btn').classList.remove('hidden');
                        document.getElementById('rate-year').value = new Date().getFullYear();
                        document.getElementById('rate-genre').value = '';
                        document.getElementById('rate-finish-date').value = this.getFormattedToday();
                    } else {
                        this.save();
                        this.render();
                        this.closeModal('rate-modal');
                        this.showToast(`Rated ${this.currentRateEpisodes.length} episode(s). Keep watching!`);
                    }
                } else {
                    this.updateEpisodeStepper();
                    this.clearRateInputs();
                }
            },

            finishAnime() {
                const anime = this.currentlyWatching[this.currentRateIndex];
                const year = parseInt(document.getElementById('rate-year').value);
                const genre = document.getElementById('rate-genre').value.trim();
                const finishDate = document.getElementById('rate-finish-date').value;

                if (!year || year < 1900 || year > 2100) { this.showToast('Invalid release year', 'error'); return; }
                if (!genre) { this.showToast('Please enter a genre', 'error'); return; }

                const rating = anime.totalEpisodeScore / anime.totalEpisodes;

                this.animeList.push({
                    name: anime.name,
                    totalEpisodeScore: anime.totalEpisodeScore,
                    episodesRated: anime.totalEpisodes,
                    rating: rating,
                    releaseYear: year,
                    genre: genre,
                    watchPeriod: anime.startDate + ' - ' + finishDate
                });

                this.currentlyWatching.splice(this.currentRateIndex, 1);
                this.save();
                this.render();
                this.closeModal('rate-modal');
                this.showToast('Anime completed and added to ranking!');
            },

            saveEdit() {
                const score = this.calcEditScore();
                const old = this.animeList[this.editingIndex];

                this.animeList[this.editingIndex] = {
                    name: old.name,
                    totalEpisodeScore: score,
                    episodesRated: 1,
                    rating: score,
                    releaseYear: old.releaseYear,
                    genre: old.genre,
                    watchPeriod: old.watchPeriod
                };

                this.save();
                this.render();
                this.closeModal('edit-modal');
                this.showToast('Anime updated successfully');
            },

            deleteAnime(index) {
                if (!confirm('Are you sure you want to delete this anime from the ranking?')) return;
                const name = this.animeList[index].name;
                this.animeList.splice(index, 1);
                this.save();
                this.render();
                this.showToast(`Deleted: ${name}`);
            },

            deleteWatching(index) {
                if (!confirm('Remove this anime from Currently Watching?')) return;
                const name = this.currentlyWatching[index].name;
                this.currentlyWatching.splice(index, 1);
                this.save();
                this.render();
                this.showToast(`Removed: ${name}`);
            },

            confirmDeleteAll() {
                if (!confirm('WARNING: This will delete ALL anime data. Are you sure?')) return;
                if (!confirm('This cannot be undone. Really delete everything?')) return;
                this.animeList = [];
                this.currentlyWatching = [];
                this.save();
                this.render();
                this.showToast('All data cleared');
            },

            // Import / Export
            exportData() {
                const data = {
                    animeList: this.animeList,
                    currentlyWatching: this.currentlyWatching,
                    exportedAt: new Date().toISOString(),
                    version: 1
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `anime-rank-list-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.showToast('Data exported successfully');
            },

            importData() {
                const fileInput = document.getElementById('import-file');
                const file = fileInput.files[0];
                if (!file) { this.showToast('Please select a file', 'error'); return; }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.animeList || !Array.isArray(data.currentlyWatching)) {
                            throw new Error('Invalid file format');
                        }
                        this.animeList = data.animeList;
                        this.currentlyWatching = data.currentlyWatching;
                        this.save();
                        this.render();
                        this.closeModal('import-modal');
                        this.showToast('Data imported successfully');
                    } catch (err) {
                        this.showToast('Failed to import: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            },

            // Utilities
            getFormattedToday() {
                const today = new Date();
                const monthNames = ['Jan', 'Feb', 'march', 'april', 'may', 'jun', 'july', 'Aug', 'sept', 'oct', 'nov', 'dec'];
                const weekdayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                return `${monthNames[today.getMonth()]} ${today.getDate()} (${weekdayNames[today.getDay()]})`;
            },

            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.style.borderLeftColor = type === 'error' ? 'var(--danger)' : 'var(--success)';
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            setupEventListeners() {
                // Real-time preview for rating
                document.querySelectorAll('[id^="rs-"], [id^="ed-"]').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const prefix = e.target.id.split('-')[0];
                        if (prefix === 'rs') {
                            document.getElementById('rs-preview').textContent = this.calcEpisodeScore().toFixed(2);
                        } else {
                            document.getElementById('ed-preview').textContent = this.calcEditScore().toFixed(2);
                        }
                    });
                });

                // Close modals on overlay click
                document.querySelectorAll('.modal-overlay').forEach(overlay => {
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) this.closeModal(overlay.id);
                    });
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal-overlay.active').forEach(m => this.closeModal(m.id));
                    }
                });
            }
        };

        const app = App;
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
